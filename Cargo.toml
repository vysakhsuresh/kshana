[workspace]
resolver = "2"
members = [
    "crates/kshana-time",
    "crates/kshana-solver",
    "crates/kshana-ephem",
    "crates/kshana-frames",
    "crates/kshana-houses",
    "crates/kshana-western",
    "crates/kshana-vedic",
    "crates/kshana-ffi", "crates/kshana-sky", "crates/kshana-cli", "crates/kshana-events", "crates/kshana-verify", "crates/kshana-chart", "crates/kshana-rules", "crates/kshana-forecast", "crates/kshana-speak", "crates/kshana-trace", "crates/kshana-ledger", "crates/kshana-directions", "crates/kshana-tajika",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "UNLICENSED"
repository = "https://github.com/vysakhsuresh/kshana"
authors = ["Vysakh Suresh"]

[workspace.dependencies]
kshana-time = { path = "crates/kshana-time" }
kshana-solver = { path = "crates/kshana-solver" }
kshana-ephem = { path = "crates/kshana-ephem" }
kshana-frames = { path = "crates/kshana-frames" }
kshana-houses = { path = "crates/kshana-houses" }
kshana-western = { path = "crates/kshana-western" }
kshana-vedic = { path = "crates/kshana-vedic" }
kshana-sky = { path = "crates/kshana-sky" }
kshana-events = { path = "crates/kshana-events" }
kshana-chart = { path = "crates/kshana-chart" }
kshana-rules = { path = "crates/kshana-rules" }
kshana-forecast = { path = "crates/kshana-forecast" }
kshana-speak = { path = "crates/kshana-speak" }
kshana-trace = { path = "crates/kshana-trace" }
kshana-tajika = { path = "crates/kshana-tajika" }
kshana-directions = { path = "crates/kshana-directions" }
kshana-ledger = { path = "crates/kshana-ledger" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
float_cmp = "allow"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
