# Google Play requires 16 KB page alignment for native libraries on 64-bit Android
# (harmless on 32-bit). NDK r27 still links with 4 KB pages by default, so ask the
# linker for 16 KB on every Android target cargo-ndk builds.
[target.aarch64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]

[target.armv7-linux-androideabi]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]

[target.x86_64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]
